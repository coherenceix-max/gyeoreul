<title>겨를</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
:root{
  --ground:#F9FBF8; --surface:#FFFFFF; --surface-2:#F1F5F0;
  --ink:#212823; --ink-soft:#465248; --muted:#718076; --line:#E4EAE3; --line-soft:#EEF2ED;
  --me:#6960A8; --me-wash:#F2F0FC;
  --kid:#548A66; --kid-wash:#EDF6EF;
  --water:#35839A; --water-wash:#EAF5F8;
  --warn:#B57F31; --warn-wash:#FBF4E9;
  --shadow:0 1px 2px rgba(31,38,34,.05), 0 8px 24px -16px rgba(31,38,34,.28);
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#181D1A; --surface:#232A26; --surface-2:#2B332E;
    --ink:#EDF2EC; --ink-soft:#D2DCD4; --muted:#9AABA1; --line:#333C37; --line-soft:#2B332E;
    --me:#B0A7EA; --me-wash:#2E2B52;
    --kid:#94C6A0; --kid-wash:#24382B;
    --water:#7CC3D4; --water-wash:#1B343B;
    --warn:#DCAF66; --warn-wash:#352C1B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#181D1A; --surface:#232A26; --surface-2:#2B332E;
  --ink:#EDF2EC; --ink-soft:#D2DCD4; --muted:#9AABA1; --line:#333C37; --line-soft:#2B332E;
  --me:#B0A7EA; --me-wash:#2E2B52;
  --kid:#94C6A0; --kid-wash:#24382B;
  --water:#7CC3D4; --water-wash:#1B343B;
  --warn:#DCAF66; --warn-wash:#352C1B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--me);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--ground)}

/* ---------- header ---------- */
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:22px 20px 14px}
.brand{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.06em}
.hdr-date{font-size:12px;color:var(--muted);letter-spacing:.01em}
.hdr-btn{font-size:12px;color:var(--muted);padding:4px 8px;border:1px solid var(--line);border-radius:999px}

main{flex:1;padding:0 20px 96px;display:flex;flex-direction:column;gap:16px}

/* ---------- generic blocks ---------- */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}

.notice{display:flex;align-items:flex-start;gap:10px;background:var(--warn-wash);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.notice b{color:var(--warn);font-weight:600}
.notice button{font-size:12px;color:var(--warn);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;flex-shrink:0}

/* ---------- ritual card ---------- */
.ritual{background:linear-gradient(170deg,var(--water-wash),var(--surface) 70%);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.ritual-head{display:flex;align-items:baseline;justify-content:space-between}
.ritual-title{font-family:var(--serif);font-size:17px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);transition:.15s}
.chk .dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.15s}
.chk[aria-pressed="true"]{border-color:var(--water);color:var(--water);background:var(--water-wash);font-weight:500}
.chk[aria-pressed="true"] .dot{background:var(--water)}
.sleep-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sleep-btn{min-width:38px;text-align:center;padding:6px 8px;border-radius:9px;border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--surface)}
.sleep-btn[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff;font-weight:500}

/* ---------- write entry buttons ---------- */
.write-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.write-btn{text-align:left;padding:15px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:5px;transition:.15s}
.write-btn:hover{border-color:currentColor}
.write-btn .wb-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.write-btn .wb-t{font-family:var(--serif);font-size:16px;color:var(--ink);line-height:1.35}
.write-btn .wb-s{font-size:11.5px;color:var(--muted)}
.wb-me{color:var(--me)} .wb-kid{color:var(--kid)}

/* ---------- prompt ---------- */
.prompt{border-left:2px solid var(--me);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:5px}
.prompt.k{border-color:var(--kid)}
.prompt p{margin:0;font-family:var(--serif);font-size:16.5px;line-height:1.55;color:var(--ink);text-wrap:balance}

/* ---------- spine timeline ---------- */
.spine{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:14px}
.spine::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.node{position:relative;display:flex;flex-direction:column;gap:5px}
.node::before{content:"";position:absolute;left:-21px;top:6px;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.node.me::before{background:var(--me)} .node.kid::before{background:var(--kid)}
.node-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.node-meta .who{font-weight:600;letter-spacing:.04em}
.node.me .who{color:var(--me)} .node.kid .who{color:var(--kid)}
.node-text{font-family:var(--serif);font-size:15.5px;line-height:1.65;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.k{background:var(--kid-wash);color:var(--kid)}
.tag.m{background:var(--me-wash);color:var(--me)}
.tag.link{cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:13.5px;line-height:1.7}

/* ---------- flow / insights ---------- */
.grid-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{font-size:10px;color:var(--muted);text-align:center;font-family:var(--mono)}
.cell{aspect-ratio:1;border-radius:6px;background:var(--surface-2);display:flex;flex-direction:column;justify-content:flex-end;gap:1px;padding:3px;position:relative}
.cell.out{opacity:.3}
.cell .bar{height:3px;border-radius:2px}
.cell .bm{background:var(--me)} .cell .bk{background:var(--kid)}
.cell .d{position:absolute;top:2px;left:4px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.cell.today{outline:1.5px solid var(--ink);outline-offset:-1.5px}

.insight{border-left:2px solid var(--water);padding-left:14px;display:flex;flex-direction:column;gap:4px}
.insight .big{font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink);text-wrap:balance}
.insight .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.progressline{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--water)}

.freq{display:flex;flex-direction:column;gap:7px}
.freq-row{display:grid;grid-template-columns:76px 1fr 26px;align-items:center;gap:9px;font-size:12.5px}
.freq-bar{height:7px;border-radius:4px;background:var(--kid);min-width:3px}
.freq-n{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}

/* ---------- reference library ---------- */
.ref{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ref-head{width:100%;text-align:left;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ref-title{font-family:var(--serif);font-size:16px;display:flex;align-items:center;gap:9px}
.ref-title .pip{width:6px;height:6px;border-radius:50%;background:var(--kid);flex-shrink:0}
.ref-title .pip.m{background:var(--me)}
.ref-count{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.ref-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:13px;border-top:1px solid var(--line-soft);padding-top:14px}
.ref-why{font-family:var(--serif);font-size:14.5px;line-height:1.7;color:var(--ink-soft)}
.ref-sec{display:flex;flex-direction:column;gap:6px}
.ref-sec h4{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ref-sec ol,.ref-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
.ref-flag{background:var(--warn-wash);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
.ref-flag b{color:var(--warn)}
.disclaimer{font-size:11.5px;color:var(--muted);line-height:1.6;padding:0 2px}

/* ---------- export ---------- */
.md-prev{font-family:var(--mono);font-size:11.5px;line-height:1.7;background:var(--surface-2);border-radius:10px;padding:13px;max-height:240px;overflow:auto;white-space:pre;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:11px;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);transition:.15s}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);font-weight:400;font-size:13.5px}
.btn.quiet:hover{color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.field input{font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}

/* ---------- tabs ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{padding:11px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);letter-spacing:.02em}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:500}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--ground);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:15px;animation:up .24s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(22px)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-title{font-family:var(--serif);font-size:18px}
.x{font-size:20px;color:var(--muted);line-height:1;padding:4px 8px}
textarea{font-family:var(--serif);font-size:16px;line-height:1.7;width:100%;min-height:130px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
textarea::placeholder{color:var(--muted);opacity:.75}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);transition:.13s}
.pill[aria-pressed="true"]{font-weight:500}
.pill.k[aria-pressed="true"]{background:var(--kid-wash);border-color:var(--kid);color:var(--kid)}
.pill.m[aria-pressed="true"]{background:var(--me-wash);border-color:var(--me);color:var(--me)}
.moodrow{display:flex;gap:7px}
.mood{flex:1;padding:11px 4px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.mood .m-n{font-family:var(--mono);font-size:15px}
.mood[aria-pressed="true"]{background:var(--me-wash);border-color:var(--me);color:var(--me);font-weight:500}

/* ---------- breathing ---------- */
.breathe{display:flex;flex-direction:column;align-items:center;gap:20px;padding:26px 0 12px}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 38% 33%,color-mix(in srgb,var(--water) 55%,transparent),color-mix(in srgb,var(--water) 16%,transparent));display:flex;align-items:center;justify-content:center;transition:transform 4s cubic-bezier(.4,0,.5,1);transform:scale(.62)}
.orb.in{transform:scale(1);transition-duration:4s}
.orb.out{transform:scale(.62);transition-duration:6s}
.orb span{font-family:var(--serif);font-size:15px;color:var(--water);letter-spacing:.08em}
.breathe-cue{font-size:13.5px;color:var(--muted);text-align:center;line-height:1.7;max-width:290px;text-wrap:balance}
.breathe-count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em}

/* ---------- 태그 제안 ---------- */
.suggest{background:var(--surface-2);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.suggest-q{font-size:12.5px;color:var(--muted);line-height:1.5}
.suggest-q b{color:var(--ink);font-weight:500}

/* ---------- 다시보기 ---------- */
.memory{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(165deg,var(--me-wash),var(--surface) 68%);padding:16px;display:flex;flex-direction:column;gap:9px}
.memory-when{display:flex;align-items:baseline;gap:8px}
.memory-when .big{font-family:var(--serif);font-size:16px;color:var(--ink)}
.memory-when .mono{font-size:11px;color:var(--muted)}
.memory-text{font-family:var(--serif);font-size:15.5px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap}
.memory-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ---------- 검색 ---------- */
.search-in{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.hit{border-left:2px solid var(--line);padding:2px 0 2px 13px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.hit.me{border-color:var(--me)} .hit.kid{border-color:var(--kid)}
.hit-meta{display:flex;gap:8px;font-size:11px;color:var(--muted)}
.hit-text{font-family:var(--serif);font-size:14.5px;line-height:1.65;color:var(--ink-soft)}
.hit mark{background:color-mix(in srgb,var(--warn) 32%,transparent);color:var(--ink);border-radius:3px;padding:0 2px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* ---------- 보관 · 책 ---------- */
.keep-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:11px}
.keep-card h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:400}
.keep-card .kc-d{font-size:13px;color:var(--muted);line-height:1.65}
.book-meter{display:flex;flex-direction:column;gap:7px}
.book-bar{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.book-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--kid),var(--me));border-radius:5px;transition:width .5s}
.book-nums{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.book-nums b{font-family:var(--mono);color:var(--ink);font-size:13px}
.spine-sample{background:var(--surface-2);border-radius:10px;padding:14px 16px;font-family:var(--serif);display:flex;flex-direction:column;gap:6px}
.spine-sample .ss-t{font-size:15px;color:var(--ink)}
.spine-sample .ss-q{font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.spine-sample .ss-a{font-size:11px;color:var(--muted);font-family:var(--sans)}
.adv{font-size:11.5px;color:var(--muted);line-height:1.6}
details.adv-box{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.adv-box>summary{padding:13px 15px;cursor:pointer;font-size:13.5px;color:var(--muted);list-style:none}
details.adv-box>summary::-webkit-details-marker{display:none}
details.adv-box>summary::after{content:" ▾";color:var(--muted)}
details.adv-box[open]>summary::after{content:" ▴"}
details.adv-box .adv-body{padding:0 15px 15px;display:flex;flex-direction:column;gap:11px;border-top:1px solid var(--line-soft);padding-top:13px}

/* ---------- 잠금 ---------- */
.lock{position:fixed;inset:0;z-index:80;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px}
.lock .brand{font-size:27px}
.lock-dots{display:flex;gap:11px}
.lock-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted)}
.lock-dot.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;width:min(268px,80vw)}
.pad button{aspect-ratio:1.5;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:19px;color:var(--ink)}
.pad button.ghost{border-color:transparent;background:none;font-size:13px;font-family:var(--sans);color:var(--muted)}
.lock-msg{font-size:13px;color:var(--muted);min-height:20px;text-align:center;line-height:1.6}
.lock-msg.err{color:var(--warn)}
.recovery{font-family:var(--mono);font-size:19px;letter-spacing:.14em;text-align:center;background:var(--surface-2);border-radius:11px;padding:15px;color:var(--ink)}

/* ---------- 첫 실행 ---------- */
.intro{position:fixed;inset:0;z-index:70;background:var(--ground);overflow-y:auto;display:flex;justify-content:center}
.intro-in{width:100%;max-width:460px;padding:min(11vh,72px) 24px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:26px}
.intro h1{font-family:var(--serif);font-size:31px;font-weight:700;letter-spacing:.08em;margin:0}
.intro h2{font-family:var(--serif);font-size:22px;font-weight:400;margin:0;line-height:1.45;text-wrap:balance}
.intro p{margin:0;font-size:14.5px;line-height:1.8;color:var(--ink-soft)}
.intro .dim{color:var(--muted);font-size:13px;line-height:1.75}
.two-track{display:flex;gap:12px}
.tt{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tt .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.tt .d{font-size:12.5px;color:var(--muted);line-height:1.6}
.tt .bar{height:3px;border-radius:2px;margin-bottom:3px}
.steps{display:flex;gap:5px}
.steps i{height:2px;flex:1;border-radius:1px;background:var(--line)}

function seedIdx(k, len){ var d=parseKey(k); return (d.getFullYear()*372 + d.getMonth()*31 + d.getDate()) % len; }
function kidPrompt(k){
  var y = key(new Date(parseKey(k).getTime() - 86400000));
  var yd = S.days[y];
  if(yd && yd.kid && yd.kid.length){
    var t = yd.kid[yd.kid.length-1].topics;
    if(t && t.length && FOLLOWUP[t[0]]) return { text: FOLLOWUP[t[0]], follow:true };
  }
  return { text: KID_PROMPTS[seedIdx(k, KID_PROMPTS.length)], follow:false };
}
function mePrompt(k){ return ME_PROMPTS[seedIdx(k, ME_PROMPTS.length)]; }

/* ==================== 렌더 유틸 ==================== */
function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var view = document.getElementById("view");
var sheetRoot = document.getElementById("sheetRoot");

function toast(msg){
  var t = el('<div style="position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--ground);padding:11px 17px;border-radius:11px;font-size:13px;max-width:88vw;text-align:center;box-shadow:var(--shadow)">'+esc(msg)+'</div>');
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

/* ==================== 시트 ==================== */
function closeSheet(){ sheetRoot.innerHTML = ""; }
function openSheet(title, buildBody){
  sheetRoot.innerHTML = "";
  var scrim = el('<div class="scrim"></div>');
  var sheet = el('<div class="sheet"><div class="sheet-head"><span class="sheet-title">'+esc(title)+'</span><button class="x" aria-label="닫기">&times;</button></div></div>');
  sheet.querySelector(".x").onclick = closeSheet;
  scrim.onclick = function(e){ if(e.target===scrim) closeSheet(); };
  scrim.appendChild(sheet);
  sheetRoot.appendChild(scrim);
  buildBody(sheet, closeSheet);
  var f = sheet.querySelector("textarea, input");
  if(f) setTimeout(function(){ f.focus(); }, 260);
}

/* ==================== 리추얼 (호흡) ==================== */
function openBreathing(onDone){
  openSheet("쓰기 전에, 몸부터", function(sheet, close){
    var body = el('<div class="breathe">'
      + '<div class="orb" id="orb"><span id="orbLabel">준비</span></div>'
      + '<div class="breathe-count mono" id="bCount">3회 남음</div>'
      + '<div class="breathe-cue" id="bCue">턱에 힘 빼고, 어깨를 귀에서 멀리 내려놓으세요.</div>'
      + '</div>');
    var actions = el('<div class="btn-row" style="justify-content:center"><button class="btn" id="skipB">건너뛰기</button></div>');
    sheet.appendChild(body); sheet.appendChild(actions);

    var orb = body.querySelector("#orb"), label = body.querySelector("#orbLabel");
    var cnt = body.querySelector("#bCount"), cue = body.querySelector("#bCue");
    var cues = ["턱에 힘 빼고, 어깨를 귀에서 멀리 내려놓으세요.","혀를 입천장에서 떼어 보세요.","눈썹 사이를 펴세요."];
    var left = 3, timers = [], stopped = false;
    function T(fn, ms){ timers.push(setTimeout(fn, ms)); }
    function finish(){
      if(stopped) return; stopped = true;
      timers.forEach(clearTimeout); close(); onDone(true);
    }
    function cycle(){
      if(stopped) return;
      if(left === 0){ label.textContent="좋아요"; T(finish, 700); return; }
      cnt.textContent = left + "회 남음";
      cue.textContent = cues[(3-left) % cues.length];
      label.textContent = "들이쉬기";
      orb.classList.remove("out"); orb.classList.add("in");
      T(function(){
        if(stopped) return;
        label.textContent = "내쉬기";
        orb.classList.remove("in"); orb.classList.add("out");
        T(function(){ left--; cycle(); }, 6000);
      }, 4000);
    }
    actions.querySelector("#skipB").onclick = function(){
      if(stopped) return; stopped = true;
      timers.forEach(clearTimeout); close(); onDone(false);
    };
    T(cycle, 350);
  });
}

/* ==================== 쓰기 시트 ==================== */
function openWrite(track, k){
  var d = day(k, true);
  var isKid = track === "kid";
  var title = isKid ? (S.child.name + " 기록") : "나의 기록";
  openSheet(title, function(sheet, close){
    var p = isKid ? kidPrompt(k) : { text: mePrompt(k) };
    var wrap = el('<div class="stack"></div>');

    wrap.appendChild(el('<div class="prompt '+(isKid?"k":"")+'">'
      + (p.follow ? '<span class="eyebrow">어제에 이어서</span>' : '<span class="eyebrow">오늘의 앵커</span>')
      + '<p>'+esc(p.text)+'</p></div>'));

    var picked = { feel:null, topics:[], mood:null, tags:[] };

    if(isKid){
      var fWrap = el('<div class="stack" style="gap:8px"><span class="eyebrow">오늘 아이 기분</span><div class="pills" id="feels"></div></div>');
      KID_FEELS.forEach(function(f){
        var b = el('<button class="pill k" aria-pressed="false">'+esc(f)+'</button>');
        b.onclick = function(){
          picked.feel = (picked.feel===f) ? null : f;
          fWrap.querySelectorAll(".pill").forEach(function(x){ x.setAttribute("aria-pressed", x.textContent===picked.feel ? "true":"false"); });
        };
        fWrap.querySelector("#feels").appendChild(b);
      });
      wrap.appendChild(fWrap);

      var tWrap = el('<div class="stack" style="gap:8px"><span class="eyebrow">주제 <span style="text-transform:none;letter-spacing:0">· 안 골라도 됩니다. 쓰다 보면 제가 물어볼게요</span></span><div class="pills" id="tops"></div></div>');
      KID_TOPICS.forEach(function(t){
        var b = el('<button class="pill k" data-id="'+t.id+'" aria-pressed="false">'+esc(t.label)+'</button>');
        b.onclick = function(){
          var i = picked.topics.indexOf(t.id);
          if(i>=0) picked.topics.splice(i,1); else picked.topics.push(t.id);
          syncPicked();
        };
        tWrap.querySelector("#tops").appendChild(b);
      });
      wrap.appendChild(tWrap);
    } else {
      var mWrap = el('<div class="stack" style="gap:8px"><span class="eyebrow">오늘의 나</span><div class="moodrow" id="moods"></div></div>');
      [["1","바닥"],["2","힘듦"],["3","보통"],["4","괜찮"],["5","좋음"]].forEach(function(m){
        var b = el('<button class="mood" aria-pressed="false"><span class="m-n">'+m[0]+'</span>'+esc(m[1])+'</button>');
        b.onclick = function(){
          picked.mood = (picked.mood===+m[0]) ? null : +m[0];
          mWrap.querySelectorAll(".mood").forEach(function(x){
            x.setAttribute("aria-pressed", (+x.querySelector(".m-n").textContent===picked.mood) ? "true":"false");
          });
        };
        mWrap.querySelector("#moods").appendChild(b);
      });
      wrap.appendChild(mWrap);

      var gWrap = el('<div class="stack" style="gap:8px"><span class="eyebrow">태그</span><div class="pills" id="mtags"></div></div>');
      ME_TAGS.forEach(function(t){
        var b = el('<button class="pill m" data-id="'+t.id+'" aria-pressed="false">'+esc(t.label)+'</button>');
        b.onclick = function(){
          var i = picked.tags.indexOf(t.id);
          if(i>=0) picked.tags.splice(i,1); else picked.tags.push(t.id);
          syncPicked();
        };
        gWrap.querySelector("#mtags").appendChild(b);
      });
      wrap.appendChild(gWrap);
    }

    var ta = el('<textarea placeholder="'+(isKid ? "한 줄이어도 충분합니다." : "떠오르는 대로. 문장이 아니어도 괜찮습니다.")+'"></textarea>');
    wrap.appendChild(ta);

    /* 쓰면 앱이 먼저 알아챕니다 — 태그를 외워서 고를 필요 없습니다 */
    var sug = el('<div class="suggest" hidden><div class="suggest-q"></div><div class="pills"></div></div>');
    wrap.appendChild(sug);

    var HINTS = isKid ? KID_HINTS : ME_HINTS;
    var labelOf = isKid ? topicLabel : meTagLabel;
    function bucket(){ return isKid ? picked.topics : picked.tags; }

    function syncPicked(){
      var list = bucket();
      Array.prototype.forEach.call(wrap.querySelectorAll(".pill[data-id]"), function(b){
        b.setAttribute("aria-pressed", list.indexOf(b.getAttribute("data-id")) >= 0 ? "true" : "false");
      });
      renderSuggest();
    }
    var lastSig = null;
    function renderSuggest(){
      var txt = ta.value.trim();
      var found = txt.length >= 6 ? detect(txt, HINTS).filter(function(id){ return bucket().indexOf(id) < 0; }) : [];
      if(!found.length){ sug.hidden = true; lastSig = null; return; }
      var sig = found.join(",");
      sug.hidden = false;
      if(sig === lastSig) return;
      lastSig = sig;
      sug.querySelector(".suggest-q").innerHTML = "이런 얘기 같은데, 맞나요? <b>안 골라도 됩니다.</b>";
      var pw = sug.querySelector(".pills");
      pw.innerHTML = "";
      found.forEach(function(id){
        var b = el('<button class="pill '+(isKid?"k":"m")+'">+ '+esc(labelOf(id))+'</button>');
        b.onclick = function(){ bucket().push(id); syncPicked(); };
        pw.appendChild(b);
      });
    }
    var tmr = null;
    ta.oninput = function(){ clearTimeout(tmr); tmr = setTimeout(renderSuggest, 350); };

    var save1 = el('<div class="btn-row" style="justify-content:flex-end"><button class="btn primary" style="flex:1">저장</button></div>');
    save1.querySelector("button").onclick = function(){
      var text = ta.value.trim();
      if(!text && !picked.feel && !picked.mood && !picked.topics.length && !picked.tags.length){
        toast("한 가지라도 남겨 주세요."); return;
      }
      var now = new Date();
      var entry = { id: uid(), u: Date.now(), t: String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"), text:text };
      if(isKid){ entry.feel = picked.feel; entry.topics = picked.topics; d.kid.push(entry); }
      else { entry.mood = picked.mood; entry.tags = picked.tags; d.me.push(entry); }

      }
    };
    wrap.appendChild(save1);
    sheet.appendChild(wrap);
  });
}

function startWrite(track){

}

function computeInsights(keys){
  var res = [];
  function avg(a){ return a.reduce(function(x,y){return x+y;},0)/a.length; }

  /* 수면 대비 나의 기분 */
  var lowS=[], highS=[];
  keys.forEach(function(k){
    var d=S.days[k]; if(!d.ritual||!d.ritual.sleep||!d.me||!d.me.length) return;
    var moods=d.me.filter(function(e){return e.mood;}).map(function(e){return e.mood;});
    if(!moods.length) return;
    (d.ritual.sleep<=5 ? lowS : highS).push(avg(moods));
  });
  if(lowS.length>=4 && highS.length>=4){
    var lo=avg(lowS), hi=avg(highS);
    if(Math.abs(hi-lo)>=0.4){
      res.push({ text:"5시간 이하로 잔 날, 당신의 기분은 평균 <b class=\"mono\">"+lo.toFixed(1)+"</b>. 그보다 잔 날은 <b class=\"mono\">"+hi.toFixed(1)+"</b>입니다.",
                 sub:"n="+lowS.length+" vs "+highS.length+" · 5점 만점" });
    }
  }

  /* 소리친 날의 수면 */
  var yellSleep=[], calmSleep=[];
  keys.forEach(function(k){
    var d=S.days[k]; if(!d.ritual||!d.ritual.sleep||!d.me||!d.me.length) return;
    var yelled=d.me.some(function(e){ return (e.tags||[]).indexOf("yelled")>=0; });
    (yelled?yellSleep:calmSleep).push(d.ritual.sleep);
  });
  if(yellSleep.length>=4 && calmSleep.length>=4){
    var ys=avg(yellSleep), cs=avg(calmSleep);
    if(cs-ys>=0.5){
      res.push({ text:"아이에게 소리친 날, 전날 잠은 평균 <b class=\"mono\">"+ys.toFixed(1)+"시간</b>이었습니다. 그러지 않은 날은 <b class=\"mono\">"+cs.toFixed(1)+"시간</b>.",
                 sub:"n="+yellSleep.length+" vs "+calmSleep.length+" · 인과가 아니라 같이 움직인 패턴입니다" });
    }
  }

  /* 아이 주제와 요일 */
  var byWd = {};
  keys.forEach(function(k){
    var d=S.days[k]; if(!d.kid) return;
    var w = parseKey(k).getDay();
    d.kid.forEach(function(e){ if((e.topics||[]).length){ byWd[w]=(byWd[w]||0)+ (e.topics.filter(function(t){return t!=="good";}).length); } });
  });
  var wdKeys = Object.keys(byWd);
  if(wdKeys.length>=4){
    var top = wdKeys.sort(function(a,b){ return byWd[b]-byWd[a]; })[0];
    var totalW = wdKeys.reduce(function(a,w){ return a+byWd[w]; },0);
    if(byWd[top]/totalW >= 0.3){
      res.push({ text:"힘든 순간이 <b>"+WD[top]+"요일</b>에 가장 많이 몰려 있습니다.",
                 sub:"전체 "+totalW+"건 중 "+byWd[top]+"건 · 그날 일정을 한 칸 비워 보세요" });
    }
  }

  /* 물 체크 */
  var wYes=[], wNo=[];
  keys.forEach(function(k){
    var d=S.days[k]; if(!d.me||!d.me.length) return;
    var moods=d.me.filter(function(e){return e.mood;}).map(function(e){return e.mood;});
    if(!moods.length) return;
    ((d.ritual&&d.ritual.water)?wYes:wNo).push(avg(moods));
  });
  if(wYes.length>=4 && wNo.length>=4 && avg(wYes)-avg(wNo) >= 0.4){
    res.push({ text:"물을 챙긴 날의 기분이 평균 <b class=\"mono\">"+(avg(wYes)-avg(wNo)).toFixed(1)+"점</b> 높습니다.",
               sub:"n="+wYes.length+" vs "+wNo.length+" · 물이 원인이라기보단, 챙길 여유가 있던 날일 수 있습니다" });
  }
  return res.slice(0,3);
}

function dayMd(k){
  var d = S.days[k], L = [];
  var moods = (d.me||[]).filter(function(e){return e.mood;}).map(function(e){return e.mood;});
  var topics = [];
  (d.kid||[]).forEach(function(e){ (e.topics||[]).forEach(function(t){ if(topics.indexOf(t)<0) topics.push(t); }); });

  L.push("---");
  L.push("date: " + k);
  L.push("tags: [겨를]");
  if(moods.length) L.push("mood: " + (moods.reduce(function(a,b){return a+b;},0)/moods.length).toFixed(1));
  if(d.ritual && d.ritual.sleep) L.push("sleep: " + d.ritual.sleep);
  if(topics.length) L.push("topics: [" + topics.map(topicLabel).join(", ") + "]");
  L.push("---");
  L.push("");
  L.push("# " + k + " " + fmtKo(k).replace(/^\d+월 \d+일 /,""));
  L.push("");

  if((d.me||[]).length){
    L.push("## 나");
    L.push("");
    d.me.forEach(function(e){
      var h = "**" + e.t + "**";
      if(e.mood) h += " · 기분 " + e.mood + "/5";
      if((e.tags||[]).length) h += " · " + e.tags.map(function(t){ return "#" + meTagLabel(t).replace(/\s/g,""); }).join(" ");
      L.push(h);
      L.push("");
      if(e.text) L.push(e.text);
      L.push("");
    });
  }
  if((d.kid||[]).length){
    L.push("## " + S.child.name);
    L.push("");
    d.kid.forEach(function(e){
      var h = "**" + e.t + "**";
      if(e.feel) h += " · " + e.feel;
      if((e.topics||[]).length) h += " · " + e.topics.map(function(t){ return "#" + topicLabel(t).replace(/\s/g,""); }).join(" ");
      L.push(h);
      L.push("");
      if(e.text) L.push(e.text);
      L.push("");
    });
  }
  var r = d.ritual || {};
  if(r.breath || r.water || r.supp || r.meal || r.sleep){
    L.push("## 리추얼");
    L.push("");
    L.push("- 호흡 " + (r.breath?"○":"—") + " · 물 " + (r.water?"○":"—") + " · 영양제 " + (r.supp?"○":"—") + " · 끼니 " + (r.meal?"○":"—"));
    if(r.sleep) L.push("- 어젯밤 잠: " + r.sleep + "시간");
    L.push("");
  }
  return L.join("\n");
}
function allMd(){
  return Object.keys(S.days).sort().filter(function(k){
    var d=S.days[k]; return (d.me&&d.me.length)||(d.kid&&d.kid.length);
  }).map(dayMd).join("\n\n");
}

function doZip(keys, btn){
  if(!keys.length){ toast("내보낼 기록이 없습니다."); return; }
  if(typeof JSZip === "undefined"){ toast("압축 도구를 불러오지 못했습니다. 전체 복사를 써 주세요."); return; }
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = "만드는 중…";
  function restore(){ btn.disabled = false; btn.textContent = label; }
  var zip = new JSZip(), folder = zip.folder("겨를");
  keys.forEach(function(k){ folder.file(k + ".md", dayMd(k)); });
  zip.generateAsync({type:"blob"}).then(function(blob){
    doSave("겨를-" + todayKey().replace(/-/g,"") + ".zip", blob, function(){ toast("내보냈습니다."); });
    restore();
  }).catch(function(){
    toast("압축에 실패했습니다. 전체 복사를 써 주세요."); restore();
  });
}

      var bv = f3.querySelector("input").value.trim();
      if(!bv || /^\d{4}-\d{2}$/.test(bv)) S.child.birth = bv;
      S.supplements = f2.querySelector("input").value.split(",").map(function(x){return x.trim();}).filter(Boolean); S.profileU = Date.now();
      save(); close(); render(); toast("저장했습니다.");
    };
    wrap.appendChild(b);

    /* 알림과 소식 — 전부 선택입니다. 하나도 켜지 않아도 앱은 그대로 씁니다.
       광고성 정보는 정보통신망법상 사전 동의가 필요해서, 켜고 끈 시각을 기록합니다. */
    var cs = el('<div class="stack" style="gap:0;margin-top:4px"></div>');
    cs.appendChild(el('<span class="eyebrow" style="margin-bottom:6px">알림과 소식 · 전부 선택</span>'));
    function isOn(k){ return !!(S.consent && S.consent[k] && S.consent[k].on); }
    function logConsent(k, on){
      if(!S.consent) S.consent = {};
      S.consent[k] = { on:on, at:new Date().toISOString() };
      if(!S.consentLog) S.consentLog = [];
      S.consentLog.push({ k:k, on:on, at:S.consent[k].at, via:"설정" });
      if(S.consentLog.length > 50) S.consentLog = S.consentLog.slice(-50);
      save();
    }
    function consentRow(k, label, desc){
      var r = el('<div class="toggle-row"><div class="tl"><b></b><span></span></div><button class="switch" role="switch"></button></div>');
      var sw = r.querySelector(".switch");
      r.querySelector("b").textContent = label;
      sw.setAttribute("aria-label", label);
      r.paint = function(){
        var on = isOn(k);
        sw.setAttribute("aria-checked", on ? "true" : "false");
        r.querySelector("span").textContent = desc + (on ? " · 동의함 " + S.consent[k].at.slice(0, 10) : "");
      };
      sw.onclick = function(){
        logConsent(k, !isOn(k));
        if(k === "promo" && !isOn("promo") && isOn("night")) logConsent("night", false);
        paintConsent();
      };
      return r;
    }
    var rPromo = consentRow("promo", "새 기능·혜택 소식 받기", "광고성 정보입니다. 지금은 보내는 게 없고, 언제든 끌 수 있어요");
    var rNight = consentRow("night", "밤 9시~아침 8시에도 받기", "꺼 두면 그 시간엔 보내지 않습니다");
    function paintConsent(){ rPromo.paint(); rNight.paint(); rNight.hidden = !isOn("promo"); }
    notifyRows(cs);
    cs.appendChild(rPromo); cs.appendChild(rNight);
    paintConsent();
    wrap.appendChild(cs);

    var introBtn = el('<button class="btn">앱 소개 다시 보기</button>');
    introBtn.onclick = function(){ close(); setTimeout(function(){ openIntro(function(){ render(); }); }, 180); };
    wrap.appendChild(introBtn);

    var pinBtn = el('<button class="btn">'+(S.pin ? "잠금 꺼짐으로 바꾸기 · 현재 켜짐" : "잠금 켜기 · 네 자리 숫자")+'</button>');
    pinBtn.onclick = function(){ close(); setTimeout(openPinSetup, 180); };
    wrap.appendChild(pinBtn);

    wrap.appendChild(el('<div class="disclaimer" style="padding-top:6px">기록은 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 함께 사라지니, 보관 탭에서 주기적으로 파일로 남겨 두세요.<br><br>겨를 <span class="mono">'+esc(APP_V)+'</span> · 최신이 아닌 것 같으면 앱을 완전히 껐다가 다시 열어 주세요.</div>'));

    var danger = el('<button class="btn" style="color:var(--warn);border-color:var(--warn)">모든 기록 지우기</button>');
    danger.onclick = function(){
      if(confirm("모든 기록을 지웁니다. 되돌릴 수 없습니다. 계속할까요?")){
        S = blank(); S.seeded = true; save(); close(); render(); toast("모두 지웠습니다.");
      }
    };
    wrap.appendChild(danger);
    sheet.appendChild(wrap);
  });
}

    var k = key(new Date(Date.now() - s.back*86400000));
    days[k] = {
      ritual:{ breath:!!s.breath, water:!!s.water, supp:!!s.supp, meal:!!s.meal, sleep:s.sleep },
      me: (s.me||[]).map(function(e,i){ return Object.assign({id:"s"+s.back+"m"+i}, e); }),
      kid:(s.kid||[]).map(function(e,i){ return Object.assign({id:"s"+s.back+"k"+i}, e); })
    };
  });
  return days;
}

/* ==================== 다시 보기 ==================== */
function hasEntries(k){ var d=S.days[k]; return !!(d && ((d.me&&d.me.length)||(d.kid&&d.kid.length))); }
function memoryPick(k){
  var d0 = parseKey(k), y, kk;
  for(y=1; y<=10; y++){
    kk = key(new Date(d0.getFullYear()-y, d0.getMonth(), d0.getDate()));
    if(hasEntries(kk)) return { k:kk, label: y===1 ? "작년 오늘" : y+"년 전 오늘" };
  }
  for(var m=1; m<=6; m++){
    kk = key(new Date(d0.getFullYear(), d0.getMonth()-m, d0.getDate()));
    if(hasEntries(kk)) return { k:kk, label: m===1 ? "한 달 전 오늘" : m+"개월 전 오늘" };
  }
  var pool = Object.keys(S.days).sort().filter(function(x){ return x < k && daysAgo(x) >= 30 && hasEntries(x); });
  if(!pool.length) pool = Object.keys(S.days).sort().filter(function(x){ return x < k && daysAgo(x) >= 6 && hasEntries(x); });
  if(pool.length){ var pk = pool[seedIdx(k, pool.length)]; return { k:pk, label: daysAgo(pk)+"일 전" }; }
  return null;
}
function memoryCard(k){
  var m = memoryPick(k);
  if(!m) return null;
  var d = S.days[m.k];
  var pick = null;
  (d.kid||[]).forEach(function(e){ if(e.text && !pick) pick = {e:e, who:S.child.name}; });
  if(!pick) (d.me||[]).forEach(function(e){ if(e.text && !pick) pick = {e:e, who:"나"}; });
  if(!pick) return null;
  var card = el('<div class="memory"></div>');
  card.appendChild(el('<div class="memory-when"><span class="big">'+esc(m.label)+'</span><span class="mono">'+esc(m.k)+'</span></div>'));
  card.appendChild(el('<div class="memory-text">'+esc(pick.e.text)+'</div>'));
  var foot = el('<div class="memory-foot"><span class="small">'+esc(pick.who)+(pick.e.feel?" · "+esc(pick.e.feel):"")+'</span></div>');
  var b = el('<button class="small" style="text-decoration:underline;text-underline-offset:3px">그날 전부 보기</button>');
  b.onclick = function(){ openDay(m.k); };
  foot.appendChild(b);
  card.appendChild(foot);
  return card;
}
function openDay(k){
  openSheet(fmtKo(k), function(sheet){
    var d = S.days[k], es = [];
    (d.me||[]).forEach(function(e){ es.push({track:"me", e:e}); });
    (d.kid||[]).forEach(function(e){ es.push({track:"kid", e:e}); });
    es.sort(function(a,b){ return a.e.t<b.e.t?-1:1; });
    var w = el('<div class="stack"></div>');

/* ==================== 하루 보내기 (카톡 · 메일) ==================== */
function dayPlain(k, opts){
  var d = S.days[k], L = [];
  L.push(fmtKo(k) + " · " + S.child.name);
  L.push("");
  (d.kid||[]).forEach(function(e){
    var h = e.t + (e.feel ? "  " + e.feel : "");
    L.push(h);
    if(e.text) L.push(e.text);
    L.push("");
  });
  if(opts && opts.includeMe && (d.me||[]).length){
    L.push("— 나의 기록 —");
    L.push("");
    d.me.forEach(function(e){
      L.push(e.t + (e.mood ? "  기분 "+e.mood+"/5" : ""));
      if(e.text) L.push(e.text);
      L.push("");
    });
  }
  L.push("겨를에서 보냄");
  return L.join("\n").replace(/\n{3,}/g, "\n\n");
}
function openShare(k){

/* 두 벌의 기록을 합칩니다. 어느 쪽도 지우지 않는 것이 원칙입니다.
   - 기록은 고유 번호로 합집합 — 폰과 패드에서 각각 쓴 건 둘 다 남습니다
   - 같은 번호가 양쪽에 있으면 나중에 고친 쪽을 택합니다
   - 리추얼 체크는 하루 단위로 나중에 고친 쪽 */
function mergeInto(target, incoming){
  var r = { days:0, added:0, updated:0, ritual:0 };
  var src = (incoming && incoming.days) || {};
  Object.keys(src).forEach(function(k){
    if(!target.days[k]){ target.days[k] = { ritual:{}, me:[], kid:[] }; r.days++; }
    var dst = target.days[k], s = src[k];
    ["me","kid"].forEach(function(tr){
      if(!dst[tr]) dst[tr] = [];
      (s[tr] || []).forEach(function(e){
        if(!e || !e.id) return;
        var at = -1;
        for(var i = 0; i < dst[tr].length; i++){ if(dst[tr][i].id === e.id){ at = i; break; } }
        if(at < 0){ dst[tr].push(e); r.added++; }
        else if((e.u || 0) > (dst[tr][at].u || 0)){ dst[tr][at] = e; r.updated++; }
      });
      dst[tr].sort(function(a, b){ return (a.t || "") < (b.t || "") ? -1 : 1; });
    });
    if(s.ritual && (s.ritualU || 0) > (dst.ritualU || 0)){
      dst.ritual = Object.assign({}, dst.ritual, s.ritual);
      dst.ritualU = s.ritualU;
      r.ritual++;
    } else if(s.ritual && !dst.ritualU && !Object.keys(dst.ritual || {}).length){
      dst.ritual = Object.assign({}, s.ritual);
      dst.ritualU = s.ritualU || 0;
      r.ritual++;
    }
  });
  return r;
}

/* ==================== 잠금 ==================== */
function hash(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; } return String(h); }
function randCode(){
  var A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", o="";
  for(var i=0;i<8;i++){ o += A[Math.floor(Math.random()*A.length)]; if(i===3) o += "-"; }
  return o;
}
function lockGate(done){
  if(!S.pin){ done(); return; }
  var buf = "";
  var g = el('<div class="lock"><span class="brand">겨를</span><div class="lock-dots"></div><div class="lock-msg">잠금을 풀어 주세요</div><div class="pad"></div></div>');
  var dots = g.querySelector(".lock-dots"), msg = g.querySelector(".lock-msg"), pad = g.querySelector(".pad");
  function paint(){
    dots.innerHTML = "";
    for(var i=0;i<4;i++) dots.appendChild(el('<span class="lock-dot'+(i<buf.length?" on":"")+'"></span>'));
  }
  function press(n){
    if(buf.length >= 4) return;

function b64(bytes){
  var s = "";

  return btoa(s);
}
function unb64(str){

  for(var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);

function deriveKey(pass, salt){
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt:salt, iterations:210000, hash:"SHA-256" },
        base, { name:"AES-GCM", length:256 }, true, ["encrypt","decrypt"]);
    });
}
function seal(obj){
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, FB.key,
      new TextEncoder().encode(JSON.stringify(obj)))
    .then(function(ct){ return b64(iv) + "." + b64(new Uint8Array(ct)); });
}
function open_(blob){
  var p = String(blob).split(".");
  return crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(p[0]) }, FB.key, unb64(p[1]))
    .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });

function stableU(dayKey, e){

function pushAll(){
  var F = FB.F, uid = FB.user.uid, jobs = [];
  if(!S.sync.pushed) S.sync.pushed = {};

      return F.setDoc(F.doc(FB.db, "users", uid, "meta", "profile"), { u:S.profileU, c:c });
    }).then(function(){ S.sync.pushed.profile = S.profileU; }));
  }
  Object.keys(S.days).forEach(function(dayKey){
    var d = S.days[dayKey];
    ["me","kid"].forEach(function(tr){
      (d[tr] || []).forEach(function(e){
        if(!e.id) e.id = uid();
        if(!e.u) e.u = stableU(dayKey, e);
        if(S.sync.pushed[e.id] === e.u) return;
        jobs.push(seal({ t:e.t, text:e.text, mood:e.mood, feel:e.feel, tags:e.tags, topics:e.topics, from:e.from })

      jobs.push(seal(d.ritual || {}).then(function(c){
        return F.setDoc(F.doc(FB.db, "users", uid, "days", dayKey), { ritualU:d.ritualU, c:c });
      }).then(function(){ S.sync.pushed["r:" + dayKey] = d.ritualU; }));
    }

/* ---------- 받아서 합치기 ---------- */
function pullAll(){
  var F = FB.F, uid = FB.user.uid;
  var incoming = { days:{} };
  function bucket(dayKey){
    if(!incoming.days[dayKey]) incoming.days[dayKey] = { ritual:{}, me:[], kid:[] };
    return incoming.days[dayKey];
  }
  return Promise.all([
    F.getDocs(F.collection(FB.db, "users", uid, "entries")),
    F.getDocs(F.collection(FB.db, "users", uid, "days")),
    F.getDoc(F.doc(FB.db, "users", uid, "meta", "profile")).catch(function(){ return null; })
  ]).then(function(snaps){
    var jobs = [];
    var prof = snaps[2];
    if(prof && prof.exists && prof.exists()){
      var pv = prof.data();
      if(pv && pv.c && (pv.u || 0) > (S.profileU || 0)){
        jobs.push(open_(pv.c).then(function(p){
          if(p.child) S.child = p.child;
          if(p.supplements) S.supplements = p.supplements;
          if(p.checkups) S.checkups = p.checkups;
          if(p.letters) S.letters = p.letters;
          if(p.bookShown) S.bookShown = p.bookShown;
          S.profileU = pv.u;
          S.sync.pushed.profile = pv.u;
        }, function(){}));
      }
    }
    snaps[0].forEach(function(docSnap){
      var v = docSnap.data();
      if(!v || !v.c) return;
      jobs.push(open_(v.c).then(function(p){
        p.id = docSnap.id; p.u = v.u;
        var b = bucket(v.day);
        (b[v.track] || b.kid).push(p);
      }, function(){}));
    });
    snaps[1].forEach(function(docSnap){
      var v = docSnap.data();
      if(!v || !v.c) return;
      jobs.push(open_(v.c).then(function(r){
        var b = bucket(docSnap.id);
        b.ritual = r; b.ritualU = v.ritualU;
      }, function(){}));
    });
    return Promise.all(jobs);
  }).then(function(){
    var got = mergeInto(S, incoming);
    Object.keys(incoming.days).forEach(function(dayKey){
      var b = incoming.days[dayKey];
      ["me","kid"].forEach(function(tr){
        b[tr].forEach(function(e){ S.sync.pushed[e.id] = e.u; });
      });
      if(b.ritualU) S.sync.pushed["r:" + dayKey] = b.ritualU;
    });
    return got;
  });
}

/* '오늘 기록 함께 보기'를 켰을 때 질문 앞에 붙는 내용 */
function todayContext(){
  var k = todayKey(), d = S.days[k];
  if(!d) return null;
  var es = [];
  (d.me || []).forEach(function(e){ es.push({ who:"나", e:e, me:true }); });
  (d.kid || []).forEach(function(e){ es.push({ who:S.child.name, e:e, me:false }); });
  if(!es.length) return null;
  es.sort(function(a, b){ return (a.e.t || "") < (b.e.t || "") ? -1 : 1; });
  var L = ["[오늘 기록 · " + k + "]"];
  es.forEach(function(x){
    var e = x.e, bits = [x.who, e.t || ""];
    if(x.me && e.mood) bits.push("기분 " + e.mood + "/5");
    if(!x.me && e.feel) bits.push(e.feel);
    var tags = x.me ? (e.tags || []).map(meTagLabel) : (e.topics || []).map(topicLabel);
    if(tags.length) bits.push(tags.map(function(t){ return "#" + t.replace(/\s/g, ""); }).join(" "));
    L.push(bits.join(" · ") + (e.text ? " — " + e.text : ""));
  });
  var r = d.ritual || {}, body = [];
  if(r.sleep) body.push("어젯밤 잠 " + r.sleep + "시간");
  if(r.meal !== undefined) body.push("끼니 " + (r.meal ? "챙김" : "못 챙김"));
  if(body.length) L.push("몸 · " + body.join(", "));
  return L.join("\n");
}

    box.appendChild(el('<div class="chat-foot">Gemini(무료)가 답합니다 · 겨를에는 남지 않지만 무료 약관상 구글 쪽엔 보관될 수 있습니다 · 진단이 아닌 참고용입니다</div>'));
    sheet.appendChild(box);

    function paintTop(){
      chip.setAttribute("aria-pressed", S.ai.withToday ? "true" : "false");
      if(S.ai.withToday){
        cap.textContent = todayContext()
          ? "켜짐 · 오늘 쓴 기록이 질문과 함께 Gemini에게 갑니다. 무료라 구글 쪽에 남을 수 있습니다."
          : "켜짐 · 다만 오늘은 아직 쓴 기록이 없습니다.";
      } else {
        cap.textContent = AIC.ctxSent
          ? "꺼짐 · 이제부터는 질문만 갑니다. 앞서 보낸 기록은 이 대화 안에 남아 있습니다."
          : "꺼짐 · 질문만 갑니다. 일기는 나가지 않습니다.";
      }
    }
    chip.onclick = function(){
      S.ai.withToday = !S.ai.withToday;
      if(S.ai.withToday) AIC.ctxSent = false;
      save(); paintTop(); paintLog();
    };
    fresh.onclick = function(){
      if(AIC.busy) return;
      AIC.chat = null; AIC.log = []; AIC.ctxSent = false;
      paintTop(); paintLog();
    };

    function paintLog(){
      fresh.hidden = !AIC.log.length;
      logEl.innerHTML = "";
      if(!AIC.log.length){
        var st = el('<div class="starters"></div>');
        st.appendChild(el('<div class="small" style="margin-bottom:2px">일기를 쓰다 떠오른 게 있으면 그대로 물어보세요.</div>'));
        var list = S.ai.withToday
          ? ["오늘 기록을 보고, 내가 놓친 게 있을까요?", "오늘 아이 행동, 어떻게 이해하면 좋을까요?", "오늘 나한테 필요한 건 뭘까요?"]
          : ["아이한테 화를 낸 게 계속 마음에 걸려요.", "요즘 아이가 떼를 자주 써요. 왜 그럴까요?", "잠들기 전마다 실랑이를 해요."];
        list.forEach(function(q){
          var b = el('<button class="starter">' + esc(q) + '</button>');
          b.onclick = function(){ send(q); };
          st.appendChild(b);
        });
        logEl.appendChild(st);
      } else {
        AIC.log.forEach(function(m){
          var b = el('<div class="bub ' + m.role + (m.wait ? " wait" : "") + (m.err ? " err" : "") + '"></div>');
          b.innerHTML = (m.ctx ? '<span class="ctx">오늘 기록과 함께 보냄</span>' : "")
            + (m.wait && !m.text ? "생각하는 중…" : (m.role === "a" ? aiFmt(m.text) : esc(m.text)));
          logEl.appendChild(b);
        });
      }
      logEl.scrollTop = logEl.scrollHeight;
      paintKeep();
    }

    /* 대화에서 깨달은 걸 오늘 나의 기록으로 옮깁니다 */
    function paintKeep(){
      keepWrap.innerHTML = "";
      var has = AIC.log.some(function(m){ return m.role === "a" && m.text && !m.err && !m.wait; });
      if(!has || AIC.busy) return;
      var kb = el('<button class="btn quiet" style="padding:4px 8px;font-size:13px">이 대화에서 남길 한 줄 →</button>');
      kb.onclick = function(){
        kb.disabled = true; kb.textContent = "정리하는 중…";
        var tr = AIC.log.filter(function(m){ return !m.err && m.text; }).map(function(m){
          return (m.role === "u" ? "부모: " : "대화 상대: ") + m.text;
        }).join("\n");
        aiLoad().then(function(){
          return aiModel({ generationConfig:{ maxOutputTokens:160, temperature:0.4 } }).generateContent(
            "아래는 부모와 대화 상대가 나눈 대화다. 부모가 이 대화에서 스스로 깨달았거나 기억해 두고 싶을 만한 것을 "
            + "부모의 1인칭 문장 하나로 적어라. 60자 안팎. 따옴표, 설명, 머리말 없이 문장만.\n\n" + tr);
        }).then(function(res){
          editKeep(String(res.response.text() || "").trim().replace(/^["'“‘]+|["'”’]+$/g, ""));
        }).catch(function(e){
          toast(aiErr(e)); paintKeep();
        });
      };
      keepWrap.appendChild(kb);
    }
    function editKeep(line){
      keepWrap.innerHTML = "";
      var ed = el('<div class="stack" style="gap:8px;background:var(--me-wash);border-radius:12px;padding:11px"></div>');
      ed.appendChild(el('<div class="small" style="color:var(--me)">오늘 나의 기록으로 남깁니다. 고쳐 써도 됩니다.</div>'));
      var t = el('<textarea style="min-height:64px;font-size:15px"></textarea>');
      t.value = line;
      ed.appendChild(t);
      var r = el('<div class="btn-row"></div>');
      var ok = el('<button class="btn primary" style="flex:1">남기기</button>');
      var no = el('<button class="btn">취소</button>');
      ok.onclick = function(){
        var v = t.value.trim();
        if(!v){ toast("한 줄을 적어 주세요."); return; }
        var k = todayKey(), d = day(k, true), now = new Date();
        d.me.push({ id:uid(), u:Date.now(), t:String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0"),
                    text:v, from:"chat", tags:[] });
        S.days[k] = d; save(); render(); syncSoon();
        keepWrap.innerHTML = "";
        toast("오늘 기록에 남겼습니다.");
      };
      no.onclick = paintKeep;
      r.appendChild(ok); r.appendChild(no);
      ed.appendChild(r);
      keepWrap.appendChild(ed);
    }

    function send(raw){
      var text = String(raw || "").trim();
      if(!text || AIC.busy) return;
      ta.value = ""; ta.style.height = "";
      var ctx = (S.ai.withToday && !AIC.ctxSent) ? todayContext() : null;
      AIC.log.push({ role:"u", text:text, ctx:!!ctx });
      var ans = { role:"a", text:"", wait:true };
      AIC.log.push(ans);
      AIC.busy = true; sendB.disabled = true;
      paintLog();
      var payload = ctx ? (ctx + "\n\n[질문]\n" + text) : text;

      /* 30초 동안 첫 글자가 안 오면 멈춘 것으로 보고 풀어 줍니다. 늦게 온 응답은 버립니다. */
      var alive = true, gotAny = false;
      function finish(){
        if(!alive) return;
        alive = false; clearTimeout(dog);
        AIC.busy = false; sendB.disabled = false;
        paintLog();
      }
      var dog = setTimeout(function(){
        if(gotAny) return;
        ans.wait = false; ans.err = true;
        ans.text = "응답이 오지 않습니다. 인터넷 연결을 확인하고 다시 물어봐 주세요.";
        AIC.chat = null;           /* 멈춘 대화는 버리고, 다음 질문은 새로 시작합니다 */
        finish();
      }, 30000);

      var ready = AIC.chat ? Promise.resolve(AIC.chat) : aiLoad().then(function(){
        AIC.chat = aiModel({ systemInstruction: aiSystem(), generationConfig:{ maxOutputTokens:1024, temperature:0.7 } })
          .startChat({ history: [] });
        return AIC.chat;
      });
      ready.then(function(chat){
        return chat.sendMessageStream(payload);
      }).then(function(result){
        if(!alive) return;
        if(ctx) AIC.ctxSent = true;
        paintTop();
        return aiRead(result, function(t){
          if(!alive) return;
          gotAny = true;
          ans.text += t; ans.wait = false;
          var last = logEl.lastElementChild;
          if(last){ last.classList.remove("wait"); last.innerHTML = aiFmt(ans.text); }
          logEl.scrollTop = logEl.scrollHeight;
        });
      }).then(function(){
        if(!alive) return;
        if(!ans.text) ans.text = "답이 비어 있습니다. 다시 물어봐 주세요.";
        ans.wait = false;
      }).catch(function(e){
        if(!alive) return;
        ans.wait = false; ans.err = true; ans.text = aiErr(e);
      }).then(finish);
    }

    sendB.onclick = function(){ send(ta.value); };
    /* 한글 입력 중(조합 중)에는 보내지 않습니다. 폰에서는 줄바꿈만. */
    var fine = window.matchMedia && window.matchMedia("(pointer:fine)").matches;
    ta.onkeydown = function(e){
      if(fine && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(ta.value); }
    };
    ta.oninput = function(){ ta.style.height = "auto"; ta.style.height = Math.min(120, ta.scrollHeight) + "px"; };

    paintTop(); paintLog();
  });
}

/* ==================== 알림 ====================
   서버는 날짜만 압니다. 이 기기가 앞으로 1년 치 '알림 보낼 날짜와 종류'만 계산해 올리고,
   서버(GitHub Actions)는 그날 내용 없는 알림을 보냅니다. 누르면 폰 안에서 풀려서 보입니다.
   알림은 선택입니다. 켜지 않으면 서버에는 아무것도 가지 않습니다. */
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function notifySupport(){
  if(isIOS() && !isStandalone()) return "ios-browser";
  return (("Notification" in window) && ("serviceWorker" in navigator) && ("PushManager" in window)) ? "ok" : "no";
}
function deviceId(){
  var id = null;
  try{ id = localStorage.getItem("naranhi.device"); }catch(e){}
  if(!id){ id = uid(); try{ localStorage.setItem("naranhi.device", id); }catch(e){} }
  return id;
}
function weekKey(d){
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return key(t);
}
function mean(a){ return a.reduce(function(x, y){ return x + y; }, 0) / a.length; }

/* 앞으로 1년 치: 어느 날 어떤 알림을 보낼지. 날짜와 종류만 담습니다. */
function buildSchedule(){
  var days = {}, today = parseKey(todayKey()), end = new Date(today.getTime() + 365 * 86400000);
  if(S.sample) return days;
  function add(d, kind){
    if(d <= today || d > end) return;
    var k = key(d);
    if(!days[k]) days[k] = [];
    if(days[k].indexOf(kind) < 0) days[k].push(kind);
  }
  var entryDays = Object.keys(S.days).filter(hasEntries).sort();

  /* N년 전 오늘 */
  entryDays.forEach(function(k){
    var d = parseKey(k);
    for(var y = 1; y <= 10; y++){
      var a = new Date(d.getFullYear() + y, d.getMonth(), d.getDate());
      if(a > end) break;
      add(a, "memory-year");
    }
  });
  /* 한 달 전 오늘 — 1년 전 알림이 없는 주에 한 번만 */
  var weekHas = {};
  Object.keys(days).forEach(function(k){ weekHas[weekKey(parseKey(k))] = true; });
  entryDays.forEach(function(k){
    var d = parseKey(k), a = new Date(d.getFullYear(), d.getMonth() + 1, d.getDate());
    if(a.getDate() !== d.getDate() || a <= today || a > end) return;
    var wk = weekKey(a);
    if(weekHas[wk]) return;
    weekHas[wk] = true;
    add(a, "memory-month");
  });
  /* 편지 — 매달 1일. 기록이 하나라도 있는 사람에게만 */
  if(entryDays.length){
    for(var i = 1; i <= 12; i++) add(new Date(today.getFullYear(), today.getMonth() + i, 1), "letter");
  }
  /* 검진 — 기간이 열리는 달과 마지막 달의 1일 */
  var bth = S.child && S.child.birth;
  if(bth && /^\d{4}-\d{2}$/.test(bth)){
    var p = bth.split("-"), by = +p[0], bm = +p[1] - 1;
    CHECKUPS.forEach(function(c){
      if(S.checkups && S.checkups[c.id]) return;
      add(new Date(by, bm + c.from, 1), "checkup-open");
      add(new Date(by, bm + c.to, 1), "checkup-last");
    });
  }
  /* 책 — 생일 달(없으면 12월) 1일, 그해 기록이 10개 이상일 때 */
  var bd = new Date(today.getFullYear(), bookMonth() - 1, 1);
  if(bd <= today) bd = new Date(today.getFullYear() + 1, bookMonth() - 1, 1);
  if(yearCount(bd.getFullYear()) >= 10) add(bd, "book");
  return days;
}
function fbReady(){
  return fbLoad().then(function(){ return FB.auth.authStateReady ? FB.auth.authStateReady() : null; })
    .then(function(){ FB.user = FB.auth.currentUser || FB.user; return FB.user; });
}
function pushSchedule(){
  if(!(S.notify && S.notify.on) || !FB.user) return Promise.resolve();
  return FB.F.setDoc(FB.F.doc(FB.db, "users", FB.user.uid, "meta", "schedule"), { days: buildSchedule(), updatedAt: Date.now() });
}
function saveDevicePrefs(){
  if(!(S.notify && S.notify.on) || !FB.user) return Promise.resolve();
  return FB.F.setDoc(FB.F.doc(FB.db, "users", FB.user.uid, "devices", deviceId()),
    { hour:S.notify.hour, kinds:S.notify.kinds, updatedAt:Date.now() }, { merge:true }).catch(function(){});
}
function recordConsent(k, on, via){
  if(!S.consent) S.consent = {};
  S.consent[k] = { on:on, at:new Date().toISOString() };
  if(!S.consentLog) S.consentLog = [];
  S.consentLog.push({ k:k, on:on, at:S.consent[k].at, via:via });
  if(S.consentLog.length > 50) S.consentLog = S.consentLog.slice(-50);
}
function withTimeout(p, ms, msg){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej({ msg:msg }); }, ms); })]);
}
/* 알림용 로그인 — 동기화 암호는 필요 없습니다. 팝업만 씁니다(돌아와서 동기화 설정으로 이어지지 않게). */
function signInPopupOnly(){
  return fbLoad().then(function(){
    var prov = new FB.U.GoogleAuthProvider();
    prov.setCustomParameters({ prompt:"select_account" });
    return FB.U.signInWithPopup(FB.auth, prov);
  }).then(function(res){ FB.user = (res && res.user) || FB.auth.currentUser; return FB.user; });
}
function registerDevice(){
  return withTimeout(navigator.serviceWorker.ready, 8000, "알림 준비가 늦어지고 있어요. 앱을 껐다 켠 뒤 다시 시도해 주세요.")
    .then(function(reg){
      return import(SDK + "firebase-messaging.js").then(function(m){
        return m.getToken(m.getMessaging(FB.app), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      });
    }).then(function(token){
      if(!token) throw { msg:"알림 주소를 받지 못했습니다." };
      S.notify.on = true;
      return FB.F.setDoc(FB.F.doc(FB.db, "users", FB.user.uid, "devices", deviceId()),
        { token:token, hour:S.notify.hour, kinds:S.notify.kinds, enabled:true, kind: isIOS() ? "ios" : "web", updatedAt:Date.now() }, { merge:true });
    }).then(function(){
      recordConsent("notify", true, "설정"); save();
      return pushSchedule();
    });
}
function unregisterDevice(){
  S.notify.on = false; recordConsent("notify", false, "설정"); save();
  if(!FB.user) return Promise.resolve();
  return FB.F.deleteDoc(FB.F.doc(FB.db, "users", FB.user.uid, "devices", deviceId())).catch(function(){});
}
function notifyRows(cs){
  var st = notifySupport(), busy = false;
  var r = el('<div class="toggle-row"><div class="tl"><b>폰 알림 받기</b><span></span></div><button class="switch" role="switch" aria-label="폰 알림 받기"></button></div>');
  var sw = r.querySelector(".switch"), desc = r.querySelector(".tl span");
  var more = el('<div class="stack" style="gap:10px;padding:0 0 12px"></div>');
  function paint(){
    var on = !!(S.notify && S.notify.on);
    sw.setAttribute("aria-checked", on ? "true" : "false");
    if(st === "ios-browser") desc.textContent = "홈 화면에 추가한 앱에서만 받을 수 있어요";
    else if(st === "no") desc.textContent = "이 브라우저는 알림을 받을 수 없어요";
    else if(!VAPID_KEY) desc.textContent = "곧 켤 수 있어요";
    else if(busy) desc.textContent = "켜는 중…";
    else if(!on && !FB.user) desc.textContent = "알림을 받으려면 구글 로그인이 필요해요. 누르면 로그인 창이 열려요";
    else desc.textContent = "다시 보기 · 편지 도착 · 검진 시기 · 책 — 하루 한 번까지, 내용 없이"
      + (on && S.consent && S.consent.notify ? " · 동의함 " + S.consent.notify.at.slice(0, 10) : "");
    more.hidden = !on;
  }
  sw.onclick = function(){
    if(busy) return;
    if(st !== "ok" || !VAPID_KEY){ toast(desc.textContent); return; }
    if(S.notify.on){ unregisterDevice().then(paint); paint(); return; }
    if(!FB.user){
      busy = true; paint();
      signInPopupOnly().then(function(){ toast("로그인됐어요. 스위치를 한 번 더 눌러 주세요."); },
        function(e){ toast(errText(e)); }).then(function(){ busy = false; paint(); });
      return;
    }
    busy = true; paint();
    Notification.requestPermission().then(function(p){
      if(p !== "granted") throw { msg:"알림이 허용되지 않았어요. 폰 설정에서 겨를 알림을 켜 주세요." };
      return registerDevice();
    }).then(function(){ toast("알림을 켰어요."); },
      function(e){ S.notify.on = false; save(); toast(errText(e)); })
      .then(function(){ busy = false; paint(); });
  };

  var hours = el('<div class="stack" style="gap:6px"><span class="small">받는 시각</span><div class="filters"></div></div>');
  [[8, "아침 8:30"], [12, "점심 12:30"], [20, "저녁 8:30"], [21, "밤 9:30"]].forEach(function(h){
    var hb = el('<button class="fchip">' + h[1] + '</button>');
    hb.setAttribute("aria-pressed", S.notify.hour === h[0] ? "true" : "false");
    hb.onclick = function(){
      S.notify.hour = h[0]; save(); saveDevicePrefs();
      Array.prototype.forEach.call(hours.querySelectorAll(".fchip"), function(x){ x.setAttribute("aria-pressed", x === hb ? "true" : "false"); });
    };
    hours.querySelector(".filters").appendChild(hb);
  });
  var kinds = el('<div class="stack" style="gap:6px"><span class="small">받을 것</span><div class="filters"></div></div>');
  [["memory", "다시 보기"], ["letter", "편지"], ["checkup", "검진"], ["book", "책"]].forEach(function(k){
    var kb = el('<button class="fchip">' + k[1] + '</button>');
    kb.setAttribute("aria-pressed", S.notify.kinds[k[0]] !== false ? "true" : "false");
    kb.onclick = function(){
      S.notify.kinds[k[0]] = S.notify.kinds[k[0]] === false;
      save(); saveDevicePrefs();
      kb.setAttribute("aria-pressed", S.notify.kinds[k[0]] !== false ? "true" : "false");
    };
    kinds.querySelector(".filters").appendChild(kb);
  });
  more.appendChild(hours); more.appendChild(kinds);
  var tb = el('<button class="btn quiet" style="align-self:flex-start;padding:4px 8px;font-size:13px">시험 알림 보내기</button>');
  tb.onclick = function(){
    if(!FB.user){ toast("로그인이 필요해요."); return; }
    tb.disabled = true; tb.textContent = "예약하는 중…";
    var days = buildSchedule(), k = todayKey();
    days[k] = (days[k] || []).concat(["test"]);
    FB.F.setDoc(FB.F.doc(FB.db, "users", FB.user.uid, "meta", "schedule"), { days:days, updatedAt:Date.now() })
      .then(function(){ toast("시험 알림을 예약했어요. 늦어도 한 시간 안에 옵니다."); },
            function(e){ toast(errText(e)); })
      .then(function(){ tb.disabled = false; tb.textContent = "시험 알림 보내기"; });
  };
  more.appendChild(tb);
  cs.appendChild(r); cs.appendChild(more);
  paint();
  if(st === "ok" && VAPID_KEY) fbReady().then(paint, function(){});
}

/* ==================== 한 달 편지 ====================
   매달 1일, 지난달 기록으로 쓰는 편지. 기기 안에서만 만들어집니다.
   기록이 없던 달에도 옵니다 — 쉬다 돌아온 사람을 모른 척하지 않으려고. */
function ym(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function ymLabel(m){ return (+m.split("-")[1]) + "월"; }
function prevYm(){ var d = new Date(); return ym(new Date(d.getFullYear(), d.getMonth() - 1, 1)); }
function daysInYm(m){ return Object.keys(S.days).sort().filter(function(k){ return k.slice(0, 7) === m && hasEntries(k); }); }
function letterData(m){
  var keys = daysInYm(m), p = m.split("-"), before = ym(new Date(+p[0], +p[1] - 2, 1));
  function topics(ks){
    var c = {};
    ks.forEach(function(k){
      (S.days[k].kid || []).forEach(function(e){ (e.topics || []).forEach(function(t){ if(t !== "good") c[t] = (c[t] || 0) + 1; }); });
    });
    return c;
  }
  var lines = [], quotes = [], lo = [], hi = [];
  keys.forEach(function(k){
    var d = S.days[k];
    (d.me || []).forEach(function(e){ if(e.from === "chat" && e.text) lines.push({ k:k, e:e }); });
    (d.kid || []).forEach(function(e){ if(e.text && e.text.length <= 70) quotes.push({ k:k, e:e }); });

    if(ms.length && d.ritual && d.ritual.sleep) (d.ritual.sleep <= 5 ? lo : hi).push(mean(ms));
  });
  return { days:keys.length, now:topics(keys), before:topics(daysInYm(before)), lines:lines,

function yearCount(y){
  return Object.keys(S.days).reduce(function(a, k){
    if(k.slice(0, 4) !== String(y)) return a;
    var d = S.days[k];
    return a + (d.me || []).filter(function(e){ return e.text; }).length + (d.kid || []).filter(function(e){ return e.text; }).length;
  }, 0);
}
function bookMonth(){ var bt = S.child && S.child.birth; return (bt && /^\d{4}-\d{2}$/.test(bt)) ? +bt.split("-")[1] : 12; }

function routeHash(){
  var h = (location.hash || "").slice(1);
  if(!h) return;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  if(h === "letter"){ TAB = "today"; render(); var m = prevYm(); setTimeout(function(){ openLetter(m, false); }, 350); }
  else if(h === "book"){ TAB = "keep"; render(); }
  else if(/^(memory|checkup)/.test(h)){ TAB = "today"; render(); window.scrollTo(0, 0); }

  /* 자동 백업 — 14일마다 한 번만 조용히 권합니다 */
  if(!S.sample){
    var due = !S.lastExport || daysAgo(S.lastExport) >= 14;
    var askedToday = S.backupAsked === todayKey();
    if(due && !askedToday){
      S.backupAsked = todayKey(); save();
      setTimeout(function(){
        openSheet("기록을 지킬 시간", function(sheet, close){
          var w = el('<div class="stack"></div>');
          w.appendChild(el('<div class="small" style="line-height:1.75">'
            + (S.lastExport ? '마지막으로 보관한 지 <b style="color:var(--ink)">'+daysAgo(S.lastExport)+'일</b>이 지났습니다.' : '아직 한 번도 파일로 남기지 않았습니다.')
            + ' 기록은 이 기기 안에만 있어서, 브라우저 데이터를 지우면 함께 사라집니다.<br><br>파일 하나로 통째로 저장해 두면 언제든 되살릴 수 있습니다.</div>'));
          var b = el('<button class="btn primary">지금 보관하기</button>');
          b.onclick = function(){ close(); doBackup(); };
          w.appendChild(b);
          var l = el('<button class="btn">나중에</button>');
          l.onclick = close;
          w.appendChild(l);
          sheet.appendChild(w);
        });
      }, 900);
    }
  }
});
})();
</script>
